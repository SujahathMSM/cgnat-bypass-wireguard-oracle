<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/></marker>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e2e8f0"/></pattern>
  </defs>

  <rect width="1400" height="720" rx="18" fill="#ffffff"/>
  <rect width="1400" height="720" rx="18" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1399" height="719" rx="18" fill="none" stroke="#e2e8f0"/>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Home server behind CGNAT, published through an Oracle Cloud VM</text>
  <text x="40" y="80" font-size="15" fill="#64748b">The home box dials out over WireGuard; the VM's public IP forwards TCP 80/443 back through the tunnel.</text>

  <!-- Visitor -->
  <g>
    <rect x="40" y="250" width="200" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="98" y="276" width="84" height="56" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <rect x="98" y="276" width="84" height="12" rx="6" fill="#334155"/>
    <circle cx="106" cy="282" r="2" fill="#f8fafc"/><circle cx="113" cy="282" r="2" fill="#f8fafc"/>
    <text x="140" y="358" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Visitor</text>
    <text x="140" y="380" font-size="13" text-anchor="middle" fill="#64748b">browser / Let's Encrypt</text>
  </g>

  <!-- DNS -->
  <g>
    <rect x="40" y="470" width="200" height="110" rx="14" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="140" y="502" font-size="15" font-weight="700" text-anchor="middle" fill="#92400e">DuckDNS</text>
    <text x="140" y="526" font-size="12.5" text-anchor="middle" fill="#92400e">your-subdomain.duckdns.org</text>
    <text x="140" y="548" font-size="12.5" text-anchor="middle" fill="#92400e">A record → 203.0.113.10</text>
    <text x="140" y="568" font-size="11.5" text-anchor="middle" fill="#b45309">(Oracle VM's public IP)</text>
  </g>
  <path d="M140 470 L140 410" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
  <text x="150" y="445" font-size="12" fill="#b45309">1. lookup</text>

  <!-- Oracle cloud -->
  <g>
    <rect x="320" y="120" width="470" height="520" rx="18" fill="#fff7f5" stroke="#c74634" stroke-width="2"/>
    <text x="344" y="152" font-size="17" font-weight="700" fill="#9a3412">Oracle Cloud · India South (Hyderabad)</text>
    <text x="344" y="174" font-size="13" fill="#9a3412">VCN dev-01 10.0.0.0/16 · public subnet 10.0.0.0/24</text>

    <rect x="344" y="192" width="422" height="78" rx="10" fill="#ffffff" stroke="#fca5a5"/>
    <text x="362" y="218" font-size="14" font-weight="700" fill="#b91c1c">Security List (cloud firewall)</text>
    <text x="362" y="240" font-size="12.5" fill="#7f1d1d">ingress: TCP 22 · UDP 51820 · TCP 80 · TCP 443</text>
    <text x="362" y="259" font-size="12.5" fill="#7f1d1d">public IP 203.0.113.10 ⇄ private 10.0.0.205 (1:1 NAT)</text>

    <rect x="344" y="288" width="422" height="330" rx="12" fill="#ffffff" stroke="#c74634"/>
    <text x="362" y="316" font-size="15" font-weight="700" fill="#0f172a">VM · VM.Standard.E2.1.Micro · Ubuntu 24.04</text>
    <text x="362" y="337" font-size="12.5" fill="#64748b">Always Free · 1 GB RAM + 2 GB swap</text>

    <rect x="362" y="352" width="180" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="452" y="376" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">ens3</text>
    <text x="452" y="396" font-size="12" text-anchor="middle" fill="#475569">10.0.0.205</text>

    <rect x="568" y="352" width="180" height="56" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="658" y="376" font-size="13" font-weight="700" text-anchor="middle" fill="#134e4a">wg0</text>
    <text x="658" y="396" font-size="12" text-anchor="middle" fill="#134e4a">10.8.0.1 · UDP 51820</text>

    <rect x="362" y="424" width="386" height="176" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="378" y="448" font-size="13" font-weight="700" fill="#0f172a">iptables (from wg0 PostUp)</text>
    <text x="378" y="472" font-size="12" fill="#334155" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace">nat PREROUTING  DNAT 80,443 → 10.8.0.2</text>
    <text x="378" y="494" font-size="12" fill="#334155" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace">nat POSTROUTING MASQUERADE -o wg0</text>
    <text x="378" y="516" font-size="12" fill="#334155" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace">FORWARD 1 ACCEPT replies wg0→ens3</text>
    <text x="378" y="538" font-size="12" fill="#334155" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace">FORWARD 2 ACCEPT 80,443 ens3→wg0</text>
    <text x="378" y="560" font-size="12" fill="#94a3b8" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace">FORWARD 3 REJECT (Oracle default)</text>
    <text x="378" y="586" font-size="12" fill="#334155">+ net.ipv4.ip_forward = 1</text>
  </g>

  <!-- visitor to oracle -->
  <path d="M240 312 L344 312" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="252" y="300" font-size="12" fill="#334155">2. TCP 443</text>

  <!-- ISP CGNAT -->
  <g>
    <rect x="850" y="230" width="190" height="270" rx="16" fill="#f8fafc" stroke="#64748b" stroke-dasharray="6 5"/>
    <text x="945" y="262" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">ISP CGNAT</text>
    <text x="945" y="284" font-size="12" text-anchor="middle" fill="#64748b">shared public IP</text>
    <text x="945" y="302" font-size="12" text-anchor="middle" fill="#64748b">198.51.100.23</text>
    <line x1="880" y1="322" x2="1010" y2="322" stroke="#cbd5e1"/>
    <text x="945" y="346" font-size="12" text-anchor="middle" fill="#b91c1c">✕ new inbound dropped</text>
    <text x="945" y="368" font-size="12" text-anchor="middle" fill="#15803d">✓ outbound + replies OK</text>
    <text x="945" y="398" font-size="11.5" text-anchor="middle" fill="#64748b">keepalive every 25 s</text>
    <text x="945" y="413" font-size="11.5" text-anchor="middle" fill="#64748b">keeps the mapping open</text>
  </g>

  <!-- Home -->
  <g>
    <rect x="1100" y="180" width="260" height="380" rx="18" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="1122" y="212" font-size="17" font-weight="700" fill="#312e81">Home Ubuntu server</text>
    <text x="1122" y="234" font-size="12.5" fill="#4338ca">HP desktop · i5-7500 · 16 GB</text>
    <rect x="1122" y="252" width="216" height="58" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="1230" y="276" font-size="13" font-weight="700" text-anchor="middle" fill="#134e4a">wg0</text>
    <text x="1230" y="296" font-size="12" text-anchor="middle" fill="#134e4a">10.8.0.2 · dials out</text>
    <rect x="1122" y="326" width="216" height="94" rx="8" fill="#ffffff" stroke="#6366f1"/>
    <text x="1230" y="352" font-size="13" font-weight="700" text-anchor="middle" fill="#312e81">Caddy :80 / :443</text>
    <text x="1230" y="374" font-size="12" text-anchor="middle" fill="#4338ca">automatic Let's Encrypt</text>
    <text x="1230" y="394" font-size="12" text-anchor="middle" fill="#4338ca">reverse_proxy → apps</text>
    <rect x="1122" y="436" width="216" height="104" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-dasharray="5 4"/>
    <text x="1230" y="462" font-size="12.5" font-weight="700" text-anchor="middle" fill="#475569">apps (next)</text>
    <text x="1230" y="484" font-size="12" text-anchor="middle" fill="#64748b">Team Ops MCP</text>
    <text x="1230" y="504" font-size="12" text-anchor="middle" fill="#64748b">Open WebUI</text>
    <text x="1230" y="524" font-size="12" text-anchor="middle" fill="#64748b">LLM proxy</text>
  </g>
  <path d="M1230 310 L1230 326" stroke="#4338ca" stroke-width="2" marker-end="url(#arrI)"/>

  <!-- Tunnel -->
  <path d="M748 380 C 800 380, 805 465, 850 465 L 1040 465 C 1085 465, 1080 282, 1122 282" stroke="#0f766e" stroke-width="10" fill="none" opacity="0.18" stroke-linecap="round"/>
  <path d="M748 380 C 800 380, 805 465, 850 465 L 1040 465 C 1085 465, 1080 282, 1122 282" stroke="#0f766e" stroke-width="2.5" fill="none" stroke-dasharray="9 6" marker-start="url(#arrT)" marker-end="url(#arrT)"/>
  <rect x="842" y="522" width="206" height="62" rx="10" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="945" y="546" font-size="13" font-weight="700" text-anchor="middle" fill="#134e4a">WireGuard tunnel</text>
  <text x="945" y="566" font-size="12" text-anchor="middle" fill="#134e4a">encrypted UDP 51820</text>
  <text x="945" y="603" font-size="12" text-anchor="middle" fill="#0f766e">3. initiated from home (outbound)</text>

  <!-- legend -->
  <g font-size="12" fill="#475569">
    <line x1="40" y1="676" x2="80" y2="676" stroke="#334155" stroke-width="2.5"/><text x="88" y="680">public request</text>
    <line x1="210" y1="676" x2="250" y2="676" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="9 6"/><text x="258" y="680">encrypted tunnel</text>
    <line x1="390" y1="676" x2="430" y2="676" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/><text x="438" y="680">DNS</text>
    <text x="520" y="680" fill="#94a3b8">IPs use documentation ranges (203.0.113.0/24, 198.51.100.0/24), not the real addresses.</text>
  </g>
</svg>
