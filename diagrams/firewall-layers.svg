<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1400" height="600" rx="18" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1399" height="599" rx="18" fill="none" stroke="#e2e8f0"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Every layer a packet must pass</text>
  <text x="40" y="80" font-size="15" fill="#64748b">A port only works when every layer on its path allows it. Dashed layers are planned hardening.</text>

  <g>
    <rect x="40" y="120" width="230" height="400" rx="16" fill="#fef2f2" stroke="#f87171"/>
    <text x="155" y="152" font-size="13" font-weight="700" text-anchor="middle" fill="#991b1b" letter-spacing="1">LAYER 1</text>
    <text x="155" y="178" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Oracle Security List</text>
    <text x="155" y="200" font-size="12.5" text-anchor="middle" fill="#64748b">cloud network edge</text>
    <g font-size="13" fill="#334155">
      <rect x="62" y="226" width="186" height="34" rx="8" fill="#ffffff" stroke="#fecaca"/><text x="155" y="248" text-anchor="middle">TCP 22 · SSH</text>
      <rect x="62" y="268" width="186" height="34" rx="8" fill="#ffffff" stroke="#fecaca"/><text x="155" y="290" text-anchor="middle">UDP 51820 · WireGuard</text>
      <rect x="62" y="310" width="186" height="34" rx="8" fill="#ffffff" stroke="#fecaca"/><text x="155" y="332" text-anchor="middle">TCP 80 · TCP 443</text>
    </g>
    <text x="155" y="380" font-size="12.5" text-anchor="middle" fill="#7f1d1d">stateful: replies</text>
    <text x="155" y="398" font-size="12.5" text-anchor="middle" fill="#7f1d1d">allowed automatically</text>
    <text x="155" y="480" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="700">missing UDP rule = issue 6</text>
  </g>

  <path d="M272 320 L298 320" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <g>
    <rect x="300" y="120" width="300" height="400" rx="16" fill="#fff7ed" stroke="#fb923c"/>
    <text x="450" y="152" font-size="13" font-weight="700" text-anchor="middle" fill="#9a3412" letter-spacing="1">LAYER 2</text>
    <text x="450" y="178" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">VM iptables</text>
    <text x="450" y="200" font-size="12.5" text-anchor="middle" fill="#64748b">Oracle image REJECTs by default</text>
    <rect x="322" y="222" width="256" height="104" rx="10" fill="#ffffff" stroke="#fed7aa"/>
    <text x="338" y="246" font-size="13" font-weight="700" fill="#9a3412">INPUT (to the VM itself)</text>
    <text x="338" y="270" font-size="12.5" fill="#334155">ACCEPT udp 51820  ← I added</text>
    <text x="338" y="290" font-size="12.5" fill="#334155">ACCEPT tcp 22 (default)</text>
    <text x="338" y="310" font-size="12.5" fill="#94a3b8">REJECT everything else</text>
    <rect x="322" y="338" width="256" height="124" rx="10" fill="#ffffff" stroke="#fed7aa"/>
    <text x="338" y="362" font-size="13" font-weight="700" fill="#9a3412">FORWARD (through the VM)</text>
    <text x="338" y="386" font-size="12.5" fill="#334155">ACCEPT replies wg0 → ens3</text>
    <text x="338" y="406" font-size="12.5" fill="#334155">ACCEPT 80,443 ens3 → wg0</text>
    <text x="338" y="426" font-size="12.5" fill="#94a3b8">REJECT everything else</text>
    <text x="338" y="448" font-size="11.5" fill="#9a3412">ACCEPTs must sit above REJECT</text>
    <text x="450" y="496" font-size="12" text-anchor="middle" fill="#c2410c" font-weight="700">rules not loaded = issue 7</text>
  </g>

  <path d="M602 320 L628 320" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <g>
    <rect x="630" y="120" width="250" height="400" rx="16" fill="#f0fdfa" stroke="#2dd4bf"/>
    <text x="755" y="152" font-size="13" font-weight="700" text-anchor="middle" fill="#115e59" letter-spacing="1">LAYER 3</text>
    <text x="755" y="178" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">WireGuard</text>
    <text x="755" y="200" font-size="12.5" text-anchor="middle" fill="#64748b">cryptographic identity</text>
    <g font-size="13" fill="#134e4a">
      <text x="652" y="246">• only known public keys</text>
      <text x="652" y="270">  get a handshake</text>
      <text x="652" y="302">• unknown keys get no reply,</text>
      <text x="652" y="326">  so scanners see nothing</text>
      <text x="652" y="358">• AllowedIPs 10.8.0.2/32:</text>
      <text x="652" y="382">  home peer can't spoof</text>
      <text x="652" y="406">  other tunnel addresses</text>
    </g>
  </g>

  <path d="M882 320 L908 320" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <g>
    <rect x="910" y="120" width="210" height="400" rx="16" fill="#ffffff" stroke="#818cf8" stroke-dasharray="8 6"/>
    <text x="1015" y="152" font-size="13" font-weight="700" text-anchor="middle" fill="#3730a3" letter-spacing="1">LAYER 4</text>
    <text x="1015" y="178" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Home ufw</text>
    <text x="1015" y="200" font-size="12.5" text-anchor="middle" fill="#64748b">planned</text>
    <g font-size="13" fill="#3730a3">
      <text x="930" y="246">allow 80,443</text>
      <text x="930" y="270">only in on wg0</text>
      <text x="930" y="310">deny everything else</text>
      <text x="930" y="334">from the tunnel</text>
    </g>
  </g>

  <path d="M1122 320 L1148 320" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <g>
    <rect x="1150" y="120" width="210" height="400" rx="16" fill="#ffffff" stroke="#818cf8" stroke-dasharray="8 6"/>
    <text x="1255" y="152" font-size="13" font-weight="700" text-anchor="middle" fill="#3730a3" letter-spacing="1">LAYER 5</text>
    <text x="1255" y="178" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">The app</text>
    <text x="1255" y="200" font-size="12.5" text-anchor="middle" fill="#64748b">Caddy + service</text>
    <g font-size="13" fill="#3730a3">
      <text x="1170" y="246">HTTPS (done)</text>
      <text x="1170" y="286">login / API key</text>
      <text x="1170" y="310">on every service</text>
      <text x="1170" y="350">rate limiting,</text>
      <text x="1170" y="374">fail2ban (planned)</text>
    </g>
  </g>

  <text x="40" y="560" font-size="13" fill="#475569">Forwarded traffic (80/443) uses the FORWARD chain, so it never needs an INPUT rule on the VM. WireGuard's own UDP 51820 terminates on the VM, so it uses INPUT.</text>
</svg>
