<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="1400" height="640" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  </defs>
  <rect width="1400" height="640" rx="18" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1399" height="639" rx="18" fill="none" stroke="#e2e8f0"/>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Why router port forwarding can't work behind CGNAT</text>
  <text x="40" y="80" font-size="15" fill="#64748b">The ISP's NAT box owns the public IP. My router only has a private address inside the ISP's network.</text>

  <!-- column headers -->
  <g font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">
    <text x="150" y="128">INTERNET</text>
    <text x="520" y="128">ISP (shared public IPv4)</text>
    <text x="860" y="128">MY ROUTER</text>
    <text x="1200" y="128">HOME SERVER</text>
  </g>

  <!-- lane 1: inbound blocked -->
  <rect x="30" y="148" width="1340" height="190" rx="14" fill="#fef2f2" stroke="#fecaca"/>
  <text x="50" y="176" font-size="15" font-weight="700" fill="#991b1b">Before: someone connects in</text>

  <rect x="70" y="200" width="160" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="150" y="240" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Visitor</text>
  <text x="150" y="262" font-size="12" text-anchor="middle" fill="#64748b">→ 198.51.100.23:443</text>

  <rect x="420" y="192" width="200" height="106" rx="12" fill="#ffffff" stroke="#64748b"/>
  <text x="520" y="222" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">CGNAT</text>
  <text x="520" y="244" font-size="12" text-anchor="middle" fill="#64748b">198.51.100.23</text>
  <text x="520" y="264" font-size="12" text-anchor="middle" fill="#64748b">shared by many homes</text>
  <text x="520" y="284" font-size="11.5" text-anchor="middle" fill="#b91c1c">"which customer is this for?"</text>

  <rect x="780" y="200" width="160" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="860" y="236" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Router</text>
  <text x="860" y="258" font-size="12" text-anchor="middle" fill="#64748b">WAN 100.64.x.x</text>
  <text x="860" y="276" font-size="11.5" text-anchor="middle" fill="#94a3b8">port forward = useless</text>

  <rect x="1120" y="200" width="160" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1200" y="240" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Ubuntu server</text>
  <text x="1200" y="262" font-size="12" text-anchor="middle" fill="#64748b">192.168.x.x</text>

  <path d="M230 245 L410 245" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#r)"/>
  <path d="M630 245 L770 245" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.35"/>
  <g transform="translate(700 245)">
    <circle r="20" fill="#b91c1c"/>
    <path d="M-8 -8 L8 8 M8 -8 L-8 8" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="700" y="290" font-size="13" font-weight="700" text-anchor="middle" fill="#b91c1c">dropped</text>

  <!-- lane 2: outbound ok + the fix -->
  <rect x="30" y="358" width="1340" height="250" rx="14" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="50" y="386" font-size="15" font-weight="700" fill="#115e59">After: the server dials out, and the VM is the front door</text>

  <rect x="70" y="410" width="160" height="110" rx="12" fill="#fff7f5" stroke="#c74634"/>
  <text x="150" y="446" font-size="15" font-weight="700" text-anchor="middle" fill="#9a3412">Oracle VM</text>
  <text x="150" y="468" font-size="12" text-anchor="middle" fill="#9a3412">203.0.113.10</text>
  <text x="150" y="488" font-size="12" text-anchor="middle" fill="#9a3412">real public IP</text>
  <text x="150" y="506" font-size="11.5" text-anchor="middle" fill="#9a3412">listens UDP 51820</text>

  <rect x="420" y="410" width="200" height="110" rx="12" fill="#ffffff" stroke="#64748b"/>
  <text x="520" y="444" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">CGNAT</text>
  <text x="520" y="468" font-size="12" text-anchor="middle" fill="#15803d">outbound allowed ✓</text>
  <text x="520" y="488" font-size="12" text-anchor="middle" fill="#15803d">replies allowed ✓</text>
  <text x="520" y="508" font-size="11.5" text-anchor="middle" fill="#64748b">mapping kept by keepalive</text>

  <rect x="780" y="420" width="160" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="860" y="460" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Router</text>
  <text x="860" y="482" font-size="12" text-anchor="middle" fill="#64748b">no config needed</text>

  <rect x="1120" y="420" width="160" height="90" rx="12" fill="#eef2ff" stroke="#4338ca"/>
  <text x="1200" y="456" font-size="15" font-weight="700" text-anchor="middle" fill="#312e81">Ubuntu server</text>
  <text x="1200" y="478" font-size="12" text-anchor="middle" fill="#4338ca">wg0 10.8.0.2</text>

  <path d="M1120 452 L950 452" stroke="#15803d" stroke-width="2.5" marker-end="url(#g)"/>
  <path d="M780 452 L630 452" stroke="#15803d" stroke-width="2.5" marker-end="url(#g)"/>
  <path d="M420 452 L240 452" stroke="#15803d" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="1035" y="440" font-size="12" text-anchor="middle" fill="#15803d">1. dial out</text>

  <path d="M150 520 L150 545 L1200 545 L1200 518" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#t)"/>
  <text x="700" y="580" font-size="13" font-weight="700" text-anchor="middle" fill="#0f766e">2. public traffic rides back down the already-open tunnel</text>
</svg>
