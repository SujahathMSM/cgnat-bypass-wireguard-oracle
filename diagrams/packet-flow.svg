<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs>
<rect width="1400" height="760" rx="18" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="1399" height="759" rx="18" fill="none" stroke="#e2e8f0"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">One HTTPS request, hop by hop</text>
<text x="40" y="80" font-size="15" fill="#64748b">The packet headers the kernel rewrites on the Oracle VM. Highlighted fields changed at that hop.</text>
<rect x="40" y="120" width="240" height="400" rx="14" fill="#f8fafc" stroke="#334155" stroke-opacity="0.5"/>
<circle cx="68" cy="152" r="15" fill="#334155"/>
<text x="68" y="157" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">1</text>
<text x="94" y="150" font-size="16" font-weight="700" fill="#0f172a">Visitor sends</text>
<text x="94" y="170" font-size="12" fill="#64748b">browser</text>
<rect x="56" y="198" width="208" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="70" y="222" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">IP / TCP HEADER</text>
<text x="72" y="255" font-size="11" font-weight="700" fill="#64748b">SRC</text>
<text x="72" y="274" font-size="14" fill="#0f172a" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">192.0.2.50:51000</text>
<text x="72" y="307" font-size="11" font-weight="700" fill="#64748b">DST</text>
<text x="72" y="326" font-size="14" fill="#0f172a" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">203.0.113.10:443</text>
<text x="160.0" y="382" font-size="13" text-anchor="middle" fill="#334155">TCP SYN to the public IP</text>
<text x="160.0" y="402" font-size="13" text-anchor="middle" fill="#334155">from DuckDNS</text>
<path d="M282 270 L304 270" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="306" y="120" width="240" height="400" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-opacity="0.5"/>
<circle cx="334" cy="152" r="15" fill="#b91c1c"/>
<text x="334" y="157" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">2</text>
<text x="360" y="150" font-size="16" font-weight="700" fill="#0f172a">Oracle edge</text>
<text x="360" y="170" font-size="12" fill="#64748b">Security List + 1:1 NAT</text>
<rect x="322" y="198" width="208" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="336" y="222" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">IP / TCP HEADER</text>
<text x="338" y="255" font-size="11" font-weight="700" fill="#64748b">SRC</text>
<text x="338" y="274" font-size="14" fill="#0f172a" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">192.0.2.50:51000</text>
<rect x="330" y="290" width="192" height="44" rx="8" fill="#b91c1c" fill-opacity="0.12" stroke="#b91c1c"/>
<text x="338" y="307" font-size="11" font-weight="700" fill="#b91c1c">DST · rewritten</text>
<text x="338" y="326" font-size="14" fill="#0f172a" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">10.0.0.205:443</text>
<text x="426.0" y="382" font-size="13" text-anchor="middle" fill="#334155">TCP 443 allowed in</text>
<text x="426.0" y="402" font-size="13" text-anchor="middle" fill="#334155">arrives on ens3</text>
<path d="M548 270 L570 270" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="572" y="120" width="240" height="400" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-opacity="0.5"/>
<circle cx="600" cy="152" r="15" fill="#c2410c"/>
<text x="600" y="157" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">3</text>
<text x="626" y="150" font-size="16" font-weight="700" fill="#0f172a">DNAT</text>
<text x="626" y="170" font-size="12" fill="#64748b">nat PREROUTING</text>
<rect x="588" y="198" width="208" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="602" y="222" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">IP / TCP HEADER</text>
<text x="604" y="255" font-size="11" font-weight="700" fill="#64748b">SRC</text>
<text x="604" y="274" font-size="14" fill="#0f172a" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">192.0.2.50:51000</text>
<rect x="596" y="290" width="192" height="44" rx="8" fill="#c2410c" fill-opacity="0.12" stroke="#c2410c"/>
<text x="604" y="307" font-size="11" font-weight="700" fill="#c2410c">DST · rewritten</text>
<text x="604" y="326" font-size="14" fill="#0f172a" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">10.8.0.2:443</text>
<text x="692.0" y="382" font-size="13" text-anchor="middle" fill="#334155">FORWARD rule 2 lets</text>
<text x="692.0" y="402" font-size="13" text-anchor="middle" fill="#334155">it cross ens3 → wg0</text>
<path d="M814 270 L836 270" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="838" y="120" width="240" height="400" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-opacity="0.5"/>
<circle cx="866" cy="152" r="15" fill="#0f766e"/>
<text x="866" y="157" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">4</text>
<text x="892" y="150" font-size="16" font-weight="700" fill="#0f172a">MASQUERADE</text>
<text x="892" y="170" font-size="12" fill="#64748b">nat POSTROUTING -o wg0</text>
<rect x="854" y="198" width="208" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="868" y="222" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">IP / TCP HEADER</text>
<rect x="862" y="238" width="192" height="44" rx="8" fill="#0f766e" fill-opacity="0.12" stroke="#0f766e"/>
<text x="870" y="255" font-size="11" font-weight="700" fill="#0f766e">SRC · rewritten</text>
<text x="870" y="274" font-size="14" fill="#0f172a" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">10.8.0.1:40312</text>
<text x="870" y="307" font-size="11" font-weight="700" fill="#64748b">DST</text>
<text x="870" y="326" font-size="14" fill="#0f172a" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">10.8.0.2:443</text>
<text x="958.0" y="382" font-size="13" text-anchor="middle" fill="#334155">so the reply comes back</text>
<text x="958.0" y="402" font-size="13" text-anchor="middle" fill="#334155">through the tunnel</text>
<path d="M1080 270 L1102 270" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="1104" y="120" width="240" height="400" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-opacity="0.5"/>
<circle cx="1132" cy="152" r="15" fill="#4338ca"/>
<text x="1132" y="157" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">5</text>
<text x="1158" y="150" font-size="16" font-weight="700" fill="#0f172a">Home server</text>
<text x="1158" y="170" font-size="12" fill="#64748b">wg0 decrypts → Caddy</text>
<rect x="1120" y="198" width="208" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="1134" y="222" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">IP / TCP HEADER</text>
<text x="1136" y="255" font-size="11" font-weight="700" fill="#64748b">SRC</text>
<text x="1136" y="274" font-size="14" fill="#0f172a" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">10.8.0.1:40312</text>
<text x="1136" y="307" font-size="11" font-weight="700" fill="#64748b">DST</text>
<text x="1136" y="326" font-size="14" fill="#0f172a" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">10.8.0.2:443</text>
<text x="1224.0" y="382" font-size="13" text-anchor="middle" fill="#334155">Caddy terminates TLS</text>
<text x="1224.0" y="402" font-size="13" text-anchor="middle" fill="#334155">and serves the site</text>
<rect x="854" y="438" width="474" height="66" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-dasharray="6 4"/>
<text x="1091.0" y="462" font-size="13" font-weight="700" text-anchor="middle" fill="#134e4a">between 4 and 5 the packet is encrypted inside WireGuard</text>
<text x="1091.0" y="484" font-size="12.5" text-anchor="middle" fill="#134e4a" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">outer: UDP 10.0.0.205:51820 → 198.51.100.23:52265</text>
<rect x="56" y="438" width="208" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
<text x="160.0" y="462" font-size="12.5" text-anchor="middle" fill="#92400e">your-subdomain.duckdns.org</text>
<text x="160.0" y="482" font-size="12.5" text-anchor="middle" fill="#92400e">resolves to 203.0.113.10</text>
<rect x="40" y="560" width="1320" height="160" rx="14" fill="#f0fdf4" stroke="#86efac"/>
<text x="64" y="594" font-size="16" font-weight="700" fill="#166534">The reply: conntrack undoes both rewrites</text>
<path d="M1230 630 L186 630" stroke="#15803d" stroke-width="2.5" marker-end="url(#b)"/>
<circle cx="1230.0" cy="630" r="7" fill="#15803d"/>
<text x="1230.0" y="664" font-size="13" font-weight="700" text-anchor="middle" fill="#166534">Caddy answers</text>
<text x="1230.0" y="686" font-size="12" text-anchor="middle" fill="#166534" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">10.8.0.2:443 → 10.8.0.1:40312</text>
<circle cx="965.0" cy="630" r="7" fill="#15803d"/>
<text x="965.0" y="664" font-size="13" font-weight="700" text-anchor="middle" fill="#166534">back through wg0</text>
<text x="965.0" y="686" font-size="12" text-anchor="middle" fill="#166534" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">encrypted, same tunnel</text>
<circle cx="700.0" cy="630" r="7" fill="#15803d"/>
<text x="700.0" y="664" font-size="13" font-weight="700" text-anchor="middle" fill="#166534">un-MASQUERADE</text>
<text x="700.0" y="686" font-size="12" text-anchor="middle" fill="#166534" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">dst → 192.0.2.50:51000</text>
<circle cx="435.0" cy="630" r="7" fill="#15803d"/>
<text x="435.0" y="664" font-size="13" font-weight="700" text-anchor="middle" fill="#166534">un-DNAT</text>
<text x="435.0" y="686" font-size="12" text-anchor="middle" fill="#166534" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">src → 10.0.0.205:443</text>
<circle cx="170.0" cy="630" r="7" fill="#15803d"/>
<text x="170.0" y="664" font-size="13" font-weight="700" text-anchor="middle" fill="#166534">Oracle edge</text>
<text x="170.0" y="686" font-size="12" text-anchor="middle" fill="#166534" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">src → 203.0.113.10:443</text>
<text x="64" y="710" font-size="12" fill="#4d7c0f">FORWARD rule 1 (RELATED,ESTABLISHED) lets these replies out. The visitor only ever sees 203.0.113.10.</text>
</svg>