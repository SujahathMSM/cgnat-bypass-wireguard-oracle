<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" rx="18" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="18" fill="none" stroke="#e2e8f0"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#0f172a">Where it goes next: a private hub-and-spoke network</text>
  <text x="40" y="80" font-size="14.5" fill="#64748b">Solid = built. Dashed = planned. Every spoke dials the hub, so each one works from behind any NAT.</text>

  <!-- links -->
  <line x1="600" y1="300" x2="230" y2="200" stroke="#0f766e" stroke-width="3"/>
  <line x1="600" y1="300" x2="970" y2="200" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 6"/>
  <line x1="600" y1="300" x2="970" y2="440" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 6"/>
  <line x1="600" y1="300" x2="230" y2="440" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 6"/>
  <line x1="600" y1="300" x2="600" y2="140" stroke="#334155" stroke-width="2.5"/>

  <!-- internet -->
  <rect x="510" y="100" width="180" height="50" rx="25" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="600" y="131" font-size="14" font-weight="700" text-anchor="middle" fill="#334155">Internet · 80/443</text>

  <!-- hub -->
  <circle cx="600" cy="300" r="92" fill="#fff7f5" stroke="#c74634" stroke-width="2.5"/>
  <text x="600" y="282" font-size="16" font-weight="700" text-anchor="middle" fill="#9a3412">Oracle VM hub</text>
  <text x="600" y="304" font-size="13" text-anchor="middle" fill="#9a3412">10.8.0.1</text>
  <text x="600" y="324" font-size="12" text-anchor="middle" fill="#9a3412">UDP 51820</text>
  <text x="600" y="342" font-size="12" text-anchor="middle" fill="#9a3412">routes 10.8.0.0/24</text>

  <!-- spokes -->
  <g>
    <rect x="90" y="150" width="280" height="100" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="230" y="184" font-size="15" font-weight="700" text-anchor="middle" fill="#312e81">Home Ubuntu server</text>
    <text x="230" y="206" font-size="13" text-anchor="middle" fill="#4338ca">10.8.0.2 · public web via hub</text>
    <rect x="178" y="218" width="104" height="22" rx="11" fill="#0f766e"/>
    <text x="230" y="233" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff">BUILT</text>
  </g>
  <g>
    <rect x="830" y="150" width="280" height="100" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="7 5"/>
    <text x="970" y="184" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">Laptop (Windows)</text>
    <text x="970" y="206" font-size="13" text-anchor="middle" fill="#64748b">10.8.0.3 · SSH / Open WebUI privately</text>
    <rect x="918" y="218" width="104" height="22" rx="11" fill="#94a3b8"/>
    <text x="970" y="233" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff">PLANNED</text>
  </g>
  <g>
    <rect x="830" y="390" width="280" height="100" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="7 5"/>
    <text x="970" y="424" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">Phone</text>
    <text x="970" y="446" font-size="13" text-anchor="middle" fill="#64748b">10.8.0.4 · WireGuard app + QR code</text>
    <rect x="918" y="458" width="104" height="22" rx="11" fill="#94a3b8"/>
    <text x="970" y="473" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff">PLANNED</text>
  </g>
  <g>
    <rect x="90" y="390" width="280" height="100" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="7 5"/>
    <text x="230" y="424" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">Other homelab nodes</text>
    <text x="230" y="446" font-size="13" text-anchor="middle" fill="#64748b">10.8.0.5+ · mini PCs, Raspberry Pi</text>
    <rect x="178" y="458" width="104" height="22" rx="11" fill="#94a3b8"/>
    <text x="230" y="473" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff">PLANNED</text>
  </g>
  <text x="600" y="530" font-size="12.5" text-anchor="middle" fill="#64748b">Spoke-to-spoke traffic is routed by the hub (ip_forward + one [Peer] block per spoke on the hub).</text>
</svg>
