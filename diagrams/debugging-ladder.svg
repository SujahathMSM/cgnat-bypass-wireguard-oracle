<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1400" height="820" rx="18" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1399" height="819" rx="18" fill="none" stroke="#e2e8f0"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">The debugging ladder: test one layer at a time, outside in</text>
  <text x="40" y="80" font-size="15" fill="#64748b">Each rung is a command that proves a layer works. The first "no" is where the bug lives.</text>

  <g font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve">
    <!-- rung 1 -->
    <rect x="60" y="116" width="560" height="112" rx="14" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="84" y="146" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">1. Do packets reach the VM?</text>
    <text x="84" y="174" fill="#334155">sudo tcpdump -ni ens3 udp port 51820</text>
    <text x="84" y="196" fill="#334155">sudo tcpdump -ni any tcp port 80</text>
    <text x="84" y="216" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">silent = blocked before the VM</text>

    <!-- rung 2 -->
    <rect x="60" y="276" width="560" height="112" rx="14" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="84" y="306" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">2. Is the tunnel up?</text>
    <text x="84" y="334" fill="#334155">sudo wg        # latest handshake? endpoint?</text>
    <text x="84" y="356" fill="#334155">ping -c 4 10.8.0.1</text>
    <text x="84" y="376" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">"sent but 0 B received" = other side never answered</text>

    <!-- rung 3 -->
    <rect x="60" y="436" width="560" height="112" rx="14" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="84" y="466" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">3. Does the backend answer inside the tunnel?</text>
    <text x="84" y="494" fill="#334155">curl -m 5 http://10.8.0.2       # from the VM</text>
    <text x="84" y="516" fill="#334155">sudo ufw status                  # on home</text>
    <text x="84" y="536" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">bypasses NAT entirely, so it isolates the app</text>

    <!-- rung 4 -->
    <rect x="60" y="596" width="560" height="134" rx="14" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="84" y="626" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">4. Are NAT + FORWARD rules loaded?</text>
    <text x="84" y="654" fill="#334155">cat /proc/sys/net/ipv4/ip_forward</text>
    <text x="84" y="676" fill="#334155">sudo iptables -t nat -L -n -v</text>
    <text x="84" y="698" fill="#334155">sudo iptables -L FORWARD -n --line-numbers</text>
    <text x="84" y="718" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">look at the packet counters, not just the rules</text>
  </g>

  <!-- yes arrows -->
  <g font-size="13" font-weight="700" fill="#15803d">
    <path d="M340 228 L340 270" stroke="#15803d" stroke-width="2.5" marker-end="url(#d)"/><text x="352" y="254">yes</text>
    <path d="M340 388 L340 430" stroke="#15803d" stroke-width="2.5" marker-end="url(#d)"/><text x="352" y="414">yes</text>
    <path d="M340 548 L340 590" stroke="#15803d" stroke-width="2.5" marker-end="url(#d)"/><text x="352" y="574">yes</text>
    <path d="M340 730 L340 766" stroke="#15803d" stroke-width="2.5" marker-end="url(#d)"/>
    <text x="352" y="790" font-size="15">yes → it works. Reboot and check again.</text>
  </g>

  <!-- no branches -->
  <g font-size="13">
    <path d="M620 172 L740 172" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#n)"/><text x="660" y="162" font-weight="700" fill="#b91c1c">no</text>
    <rect x="750" y="122" width="600" height="100" rx="14" fill="#fef2f2" stroke="#f87171"/>
    <text x="774" y="152" font-size="15" font-weight="700" fill="#991b1b">Cloud firewall: Oracle Security List</text>
    <text x="774" y="176" fill="#7f1d1d">Ingress rule on the PUBLIC subnet's list? Right protocol?</text>
    <text x="774" y="198" fill="#7f1d1d">Port in Destination (not Source)?</text>
    <rect x="1186" y="134" width="150" height="26" rx="13" fill="#b91c1c"/>
    <text x="1261" y="152" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">hit this: issue 6</text>

    <path d="M620 332 L740 332" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#n)"/><text x="660" y="322" font-weight="700" fill="#b91c1c">no</text>
    <rect x="750" y="282" width="600" height="100" rx="14" fill="#fef2f2" stroke="#f87171"/>
    <text x="774" y="312" font-size="15" font-weight="700" fill="#991b1b">Tunnel config or VM INPUT chain</text>
    <text x="774" y="336" fill="#7f1d1d">Public keys swapped correctly? Endpoint IP:port right?</text>
    <text x="774" y="358" fill="#7f1d1d">UDP 51820 ACCEPT above Oracle's REJECT rule?</text>

    <path d="M620 492 L740 492" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#n)"/><text x="660" y="482" font-weight="700" fill="#b91c1c">no</text>
    <rect x="750" y="442" width="600" height="100" rx="14" fill="#fef2f2" stroke="#f87171"/>
    <text x="774" y="472" font-size="15" font-weight="700" fill="#991b1b">Home server</text>
    <text x="774" y="496" fill="#7f1d1d">Is the app or Caddy running and listening?</text>
    <text x="774" y="518" fill="#7f1d1d">Does ufw block traffic arriving on wg0?</text>

    <path d="M620 662 L740 662" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#n)"/><text x="660" y="652" font-weight="700" fill="#b91c1c">no</text>
    <rect x="750" y="602" width="600" height="122" rx="14" fill="#fef2f2" stroke="#f87171"/>
    <text x="774" y="632" font-size="15" font-weight="700" fill="#991b1b">PostUp rules not active</text>
    <text x="774" y="656" fill="#7f1d1d">grep -c PostUp /etc/wireguard/wg0.conf  (expect 4)</text>
    <text x="774" y="678" fill="#7f1d1d">systemctl restart wg-quick@wg0, then re-check counters</text>
    <text x="774" y="700" fill="#7f1d1d">ip_forward = 1?  ACCEPT rules above REJECT?</text>
    <rect x="1186" y="614" width="150" height="26" rx="13" fill="#b91c1c"/>
    <text x="1261" y="632" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">hit this: issue 7</text>
  </g>
</svg>
