# /etc/sysctl.d/99-wireguard-forwarding.conf on the Oracle VM
#
# By default Linux drops packets that are not addressed to itself.
# Turning on IPv4 forwarding lets the VM act as a router and pass traffic
# between the internet (ens3) and the WireGuard tunnel (wg0).
#
# Apply without a reboot:  sudo sysctl --system
net.ipv4.ip_forward = 1
